name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if ! python3 -m json.tool "$f" > /dev/null; then
              echo "::error file=$f::Invalid JSON"
              fail=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*' -print0)
          exit $fail

      - name: Syntax-check KubeJS scripts
        run: |
          if [ -d kubejs ]; then
            fail=0
            while IFS= read -r -d '' f; do
              node --check "$f" || { echo "::error file=$f::Syntax error"; fail=1; }
            done < <(find kubejs -name '*.js' -print0)
            exit $fail
          fi

      - name: Check required docs
        run: |
          for f in PLAN.md README.md CLAUDE.md; do
            [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
          done

  server-boot:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORGE_VERSION: 1.20.1-47.4.13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Pakku / mod downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.pakku
            .pakku
            ~/.cache/pakku
          key: pakku-${{ hashFiles('pakku-lock.json') }}
          restore-keys: pakku-

      - name: Get Pakku
        run: |
          if [ ! -f pakku.jar ]; then
            curl -fsSL -o pakku.jar https://github.com/juraj-hrivnak/Pakku/releases/download/v1.5.0/pakku.jar
          fi

      - name: Fetch mods and export server pack
        run: |
          java -jar pakku.jar -y fetch
          python3 -I tools/audit_deps.py mods
          python3 -I tools/validate_gtguide.py
          java -jar pakku.jar -y export
          ls -laR build || true

      - name: Install Forge server
        run: |
          mkdir -p server
          curl -fsSL -o forge-installer.jar \
            "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-installer.jar"
          cd server
          java -jar ../forge-installer.jar --installServer

      - name: Verify exported packs contain KubeJS
        run: |
          mrpack=$(find build/modrinth -name '*.mrpack' | head -n1)
          pack=$(find build/serverpack -name '*.zip' | head -n1)
          [ -n "$mrpack" ] || { echo "::error::No mrpack exported"; exit 1; }
          [ -n "$pack" ] || { echo "::error::No server pack exported"; exit 1; }
          unzip -l "$mrpack" | grep -q 'overrides/kubejs/server_scripts/gating/.*\.js' \
            || { echo "::error::mrpack lacks overrides/kubejs/"; exit 1; }
          unzip -l "$mrpack" | grep -q 'overrides/kubejs/client_scripts/.*\.js' \
            || { echo "::error::mrpack lacks overrides/kubejs/client_scripts"; exit 1; }
          unzip -l "$pack" | grep -q ' kubejs/server_scripts/gating/.*\.js' \
            || { echo "::error::server pack lacks kubejs/"; exit 1; }

      - name: Assemble server directory (exported zip only)
        run: |
          pack=$(find build/serverpack -name '*.zip' | head -n1)
          [ -n "$pack" ] || { echo "::error::No exported server pack"; exit 1; }
          unzip -oq "$pack" -d server
          echo "eula=true" > server/eula.txt
          sed -i 's/^online-mode=.*/online-mode=false/' server/server.properties 2>/dev/null || true

      - name: Boot server headless
        working-directory: server
        run: |
          args=$(find libraries -name unix_args.txt | head -n1)
          mkdir -p logs
          timeout 600 java -Xmx4G @user_jvm_args.txt @"$args" nogui < <(tail -f /dev/null) > logs/ci-boot.log 2>&1 &
          pid=$!
          for i in $(seq 1 120); do
            if grep -q 'Done (' logs/ci-boot.log; then
              echo "Server booted OK"
              pkill -f 'unix_args.txt' || true
              sleep 5
              log=logs/kubejs/server.log
              [ -f "$log" ] || { echo "::error::$log missing; KubeJS did not run"; exit 1; }
              grep -E 'Loaded script server_scripts:gating/' "$log"
              n=$(grep -c 'Loaded script server_scripts:gating/' "$log" || true)
              [ "$n" -ge 7 ] || { echo "::error::Only $n gating scripts loaded (need >=7)"; cat "$log"; exit 1; }
              grep -E 'Loaded ([0-9]+)/([0-9]+) KubeJS server scripts .* with 0 errors' "$log" \
            || { echo "::error::KubeJS did not load all server scripts with 0 errors"; cat "$log"; exit 1; }
              exit 0
            fi
            kill -0 $pid 2>/dev/null || break
            sleep 5
          done
          echo "::error::Server did not reach 'Done (' in time"
          tail -n 100 logs/ci-boot.log || true
          pkill -f 'unix_args.txt' || true
          exit 1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-boot-logs
          path: |
            server/logs/
            server/crash-reports/
          if-no-files-found: ignore

  client-boot:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Pakku / mod downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.pakku
            .pakku
            ~/.cache/pakku
          key: pakku-${{ hashFiles('pakku-lock.json') }}
          restore-keys: pakku-

      - name: Get Pakku
        run: |
          if [ ! -f pakku.jar ]; then
            curl -fsSL -o pakku.jar https://github.com/juraj-hrivnak/Pakku/releases/download/v1.5.0/pakku.jar
          fi

      - name: Fetch mods and export mrpack
        run: |
          java -jar pakku.jar -y fetch
          java -jar pakku.jar -y export

      - name: Unpack client files into run/
        run: |
          mrpack=$(find build/modrinth -name '*.mrpack' | head -n1)
          [ -n "$mrpack" ] || { echo "::error::No mrpack exported"; exit 1; }
          # Inventory Profiles Next + libIPN hang the headless client (xvfb) while joining
          # a world; verified working on a real client 2026-10-22. Skipped here only.
          python3 -I tools/unpack_mrpack.py "$mrpack" run             --exclude "*inventoryprofilesnext*" --exclude "*libipn*"
          ls run/mods | wc -l
          [ -d run/kubejs ] || { echo "::error::overrides lacked kubejs/"; exit 1; }

      - name: Run client (join world, then exit)
        uses: headlesshq/mc-runtime-test@5.0.0
        timeout-minutes: 10
        with:
          mc: 1.20.1
          modloader: forge
          mc-runtime-test: lexforge
          mc-runtime-test-version: '5.0.0'
          java: '17'
          xvfb: 'true'
          headlessmc-command: >-
            --jvm "-Djava.awt.headless=true -Xmx6G"

      - name: Check client logs
        if: always()
        run: python3 -I tools/check_client_logs.py run

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-boot-logs
          path: |
            run/logs/
            run/crash-reports/
            run/kubejs/logs/
          if-no-files-found: ignore

  publish-pack:
    needs: [server-boot, client-boot]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Pakku / mod downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.pakku
            .pakku
            ~/.cache/pakku
          key: pakku-${{ hashFiles('pakku-lock.json') }}
          restore-keys: pakku-

      - name: Get Pakku
        run: |
          if [ ! -f pakku.jar ]; then
            curl -fsSL -o pakku.jar https://github.com/juraj-hrivnak/Pakku/releases/download/v1.5.0/pakku.jar
          fi

      - name: Export mrpack
        run: |
          java -jar pakku.jar -y fetch
          java -jar pakku.jar -y export

      - name: Convert to packwiz
        run: |
          mrpack=$(find build/modrinth -name '*.mrpack' | head -n1)
          [ -n "$mrpack" ] || { echo "::error::No mrpack exported"; exit 1; }
          python3 -I tools/mrpack_to_packwiz.py "$mrpack" "$RUNNER_TEMP/pack"

      - name: Publish pack branch (orphan, overwritten each time)
        run: |
          cd "$RUNNER_TEMP/pack"
          git init -q
          git checkout -q --orphan pack
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish packwiz pack from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pack:pack
